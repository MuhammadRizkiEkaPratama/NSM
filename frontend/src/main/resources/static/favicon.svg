<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Ikon tab peramban NSM.

    Bentuknya sengaja mengulang cincin neon yang mengelilingi tiap kartu
    device di dashboard, supaya tab ini dikenali sebagai bagian dari aplikasi
    yang sama, bukan gambar yang kebetulan ditempel.

    Dirancang untuk 16 piksel. Karena itu tidak ada huruf dan tidak ada
    detail halus: pada ukuran itu keduanya berubah jadi bercak. Yang tersisa
    hanya dua bentuk yang masih terbaca, yaitu cincin dan titik di tengahnya.

    Kotaknya gelap dan bukan transparan, supaya ikonnya tetap terlihat di
    peramban bertema terang maupun gelap.
  -->
  <rect width="32" height="32" rx="8" fill="#111315"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#4ade80" stroke-width="2.6" opacity=".55"/>
  <path d="M16 6.5a9.5 9.5 0 0 1 9.5 9.5" fill="none" stroke="#4ade80"
        stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.6" fill="#4ade80"/>
</svg>

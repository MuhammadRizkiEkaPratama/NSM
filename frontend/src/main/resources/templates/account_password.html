<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Ganti Password - NSM</title>
<script src="/js/tema.js"></script>
<link rel="stylesheet" href="/vendor/font/manrope.css">
<link rel="stylesheet" href="/css/nsm.css">
</head>
<body>

<div th:replace="~{fragmen/nav :: bilah('Ganti Password', '', 'password')}"></div>

<div style="display:flex; justify-content:center;">
  <div class="panel panel-rapat">
    <h2>Ganti Password</h2>
    <div class="pengantar">
      Password baru wajib memenuhi aturan keamanan yang sama dengan saat mendaftar.
      Setelah berganti, sesi di perangkat lain tidak otomatis keluar.
    </div>

    <div class="pesan-galat" th:if="${error}" th:text="${error}"></div>
    <div class="pesan-sukses" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/account/password}" method="post">
      <label class="label-atas" for="cur">Password Lama</label>
      <input type="password" name="current" id="cur" required autocomplete="current-password">

      <label class="label-atas" for="pw">Password Baru</label>
      <input type="password" name="password" id="pw" required autocomplete="new-password">
      <div class="meter"><div id="bar"></div></div>
      <div class="meter-teks" id="lbl">Ketik password baru</div>
      <ul class="aturan">
        <li id="r-len">Minimal 8 karakter</li>
        <li id="r-upper">Ada huruf besar</li>
        <li id="r-lower">Ada huruf kecil</li>
        <li id="r-digit">Ada angka</li>
      </ul>

      <label class="label-atas" for="pw2">Ulangi Password Baru</label>
      <input type="password" name="confirm" id="pw2" required autocomplete="new-password">
      <div class="meter-teks" id="matchlbl"></div>

      <label class="baris-centang"><input type="checkbox" id="showpw"> Lihat password</label>
      <button type="submit" class="tombol-utama tombol-lebar" style="margin-top:var(--sp-5)">Ganti Password</button>
    </form>

    <div class="tautan-bawah"><a th:href="@{/}">Kembali ke dashboard</a></div>
  </div>
</div>

<script src="/js/latar.js"></script>
<script src="/js/kekuatan-password.js"></script>
<script src="/js/istilah.js"></script>
<script src="/js/halaman.js"></script>
<script src="/js/petunjuk.js"></script>
</body>
</html>

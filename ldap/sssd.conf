[sssd]
config_file_version = 2
domains = bsp
services = nss, pam

[domain/bsp]
# Central directory at 192.168.20.101. The rfc2307 schema is used because groups
# here are posixGroup with memberUid (plain uid), not groupOfNames with full DNs.
id_provider   = ldap
auth_provider = ldap
ldap_uri = ldap://192.168.20.101:389
ldap_search_base       = dc=bsp,dc=id
ldap_user_search_base  = ou=people,dc=bsp,dc=id
ldap_group_search_base = ou=groups,dc=bsp,dc=id
ldap_schema = rfc2307

# No TLS. SSH passwords travel as plain text from this machine to .101. On the
# VirtualBox host-only network the traffic stays on the laptop, which is acceptable
# for this lab, but LDAPS (:636) or StartTLS is required before any real network use.
ldap_id_use_start_tls = false
ldap_auth_disable_tls_never_use_in_production = true

# Only the sysadmin group may log in. Valid credentials in the directory must not
# mean the right to log in to this machine. Six of eight users already have
# /usr/sbin/nologin, but relying on that alone is too thin: a shell change in the
# directory would silently open SSH access.
#
# On .103 this line differs on purpose:
#
#     simple_allow_groups = sysadmin, berkas
#
# .103 runs the SFTP file server, so group `berkas` must reach sshd there; .101 has
# no file server and holds the identity directory and database. This file is the
# .101 version; `sftp/pasang-sftp.sh` edits the .103 copy in place.
access_provider = simple
simple_allow_groups = sysadmin

# Cache credentials that worked before, so people can still log in when .101 is
# down (the identity server dying must not lock everyone out).
cache_credentials = true
offline_credentials_expiration = 7

# Do not pull the whole directory. For a small lab the difference is unnoticeable, but the
# habit matters: enumerate = true makes every `getent passwd` copy the entire directory.
enumerate = false

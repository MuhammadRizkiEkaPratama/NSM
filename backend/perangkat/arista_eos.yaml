nama: arista_eos
keterangan: Arista EOS
teruji: dokumentasi
# There are no Arista devices in this lab. None of these commands has been run
# on real EOS.
#
# Specific risk of this file: EOS deliberately mimics Cisco IOS syntax, so it
# is tempting to copy cisco_ios.yaml and rename it. That would pass every
# test, since no test can tell "same because checked" from "same because
# copied". The notes below state, per command, whether it matches IOS or
# differs, and matches are deliberate.

deteksi:
  # Arista Networks' IANA PEN. Different from Cisco (9), and the most important
  # field here: with Cisco's prefix every Arista would be identified as Cisco
  # and sent Cisco commands, most of which would appear to work. A
  # misidentification that mostly works is much harder to spot than one that
  # fails outright.
  sysobjectid:
    - ".1.3.6.1.4.1.30065."

akses:
  netmiko_device_type: arista_eos
  jenis: jaringan
  butuh_enable: true

  # Same as IOS, confirmed from code: netmiko's Arista driver calls
  # `disable_paging()` without a `command` argument, so the base default
  # "terminal length 0" is used. The driver also runs `terminal width 511`
  # first and expects the EOS-specific reply "Pagination disabled".
  paging_mati: terminal length 0

baca:
  # Same as IOS. EOS provides both commands with the same names, and its
  # running/startup split works like IOS.
  konfigurasi: show running-config
  konfigurasi_startup: show startup-config

  # Same as IOS.
  interface_ringkas: show ip interface brief
  interface_rinci: show interfaces
  tabel_rute: show ip route
  identitas: show version

  # Deliberately different from cisco_ios.yaml, which uses
  # `show run | include hostname` only because connectors/ssh.py already did.
  # EOS has a dedicated `show hostname`, so the costlier form is not inherited.
  nama_host: show hostname

  # Not in cisco_ios.yaml. The IOS command `show processes cpu | include CPU
  # utilization` depends on IOS output wording, which EOS does not guarantee.
  # `show processes top once` is recorded as the EOS equivalent.
  cpu: show processes top once

tulis:
  didukung: true
  mode_konfig: configure terminal

  # Same as IOS. EOS accepts both `write memory` and `copy running-config
  # startup-config`; the former is shorter and matches cisco_ios.yaml.
  simpan: write memory

  # Safety net: `configure session` + `commit timer`.
  #
  # `pasang` is deliberately EMPTY, which differs from `jenis: tidak_ada`: the
  # mechanism exists and is documented, but the exact command sequence is
  # unverified. It takes two steps (`configure session <name>`, then
  # `commit timer <time>`), which one string cannot hold, and guessing would
  # mean running an invented sequence on hardware nobody here has.
  #
  # `bisa_pasang_jaring_pengaman` therefore answers NO for this platform, which
  # is correct: a safety net that exists only on paper is no net at all.
  jaring_pengaman:
    jenis: commit_confirmed
    pasang: ""

rahasia:
  # Line format is close to IOS, so the base patterns in connectors/konfig.py
  # catch most of it. Only EOS-specific forms are added here.
  #
  # `username ... secret sha512 $6$...`: EOS names the algorithm as a word
  # (sha512/md5) while IOS uses a number (`secret 5`). The base pattern uses
  # `\d*` there, so the EOS form would NOT be caught. A near-match like this is
  # exactly what leaks.
  - pola: '(?im)^(\s*username\s+\S+(?:\s+privilege\s+\d+)?(?:\s+role\s+\S+)?\s+secret\s+(?:sha512|sha256|md5|\d+)\s+).+$'
    ganti: '\1<DISAMARKAN>'
  # `enable secret sha512 ...` is deliberately not listed: the base pattern in
  # connectors/konfig.py (`\d*\s*` matches zero length) already catches the whole
  # line. A pattern that never fires gives false assurance in a file meant to protect secrets.
  - pola: '(?im)^(\s*(?:tacacs-server|radius-server)\s+.*\bkey\s+\d*\s*).+$'
    ganti: '\1<DISAMARKAN>'

kemampuan: {}
# Deliberately EMPTY. Each capability enables a code path that contacts the
# device in a specific way, and none has been tried on real Arista hardware.
# `dialek_perangkat` defaults unlisted capabilities to "not supported" for
# exactly this case.

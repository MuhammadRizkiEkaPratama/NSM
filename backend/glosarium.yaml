# ---------------------------------------------------------------------------
# DOMAIN TERMS -- the most decisive, and the easiest to get wrong
# ---------------------------------------------------------------------------
domain:
  # DEVICES AND NETWORK
  perangkat: device
  jaringan: network
  alamat: address
  antarmuka: interface
  rute: route
  jalan: path
  sambungan: connection
  sesi: session
  putaran: cycle
  pemantau: monitor
  pantau: monitor

  # STATES
  aktif: active
  mati: down
  hidup: alive
  keadaan: state
  jeda: pause
  kestabilan: stability
  ambang: threshold
  diamati: observed

  # INCIDENTS
  insiden: incident
  gangguan: outage
  gejala: symptom
  # `akar` = ROOT CAUSE analysis, not "root" as in directory or root user.
  # Translated in full so it cannot be confused with either; both exist in the same
  # code.
  akar: root_cause
  korelasi: correlation
  keparahan: severity
  dampak: impact
  hilir: downstream

  # CONFIGURATION
  konfig: config
  konfigurasi: configuration
  potret: snapshot
  # `sidik` = fingerprint (hash) of the configuration content. Not "signature": it
  # is a sha256 of the text, and `signature` already means something else in
  # cryptography and in Python (`inspect.signature`).
  sidik: fingerprint
  beda: diff
  berubah: changed
  penyimpangan: drift
  definisi: definition
  dialek: dialect
  katalog: catalog
  templat: template
  aturan: rule
  kepatuhan: compliance
  temuan: finding
  bukti: evidence
  vonis: verdict

  # SECURITY AND ACTIONS
  # `pagar` and `penjaga` deliberately differ in English. Both guard, but at
  # different layers and the code distinguishes them: `pagar_otomasi` is the six
  # gates passed BEFORE an automatic action may run, while `penjaga_aksi` runs the
  # action together with its own checks. Mapping both to `guard` would erase that
  # distinction.
  pagar: guardrail
  penjaga: guard
  jaring: net
  pengaman: safety
  aman: safe
  izin: permission
  boleh: allowed
  ditolak: rejected
  tolak: reject
  blokir: block
  # `buka` depends on context. In a firewall it is `unblock`; in "an outage still
  # open" it is `open`. This glossary picks the former because it is more frequent,
  # and the only place the second meaning appears (`hapus_event_hantu.py`) is
  # already hand-written as `pending`.
  buka: unblock
  putih: allow          # `daftar_putih` -> `allow_list`
  hitam: deny           # `daftar_hitam` -> `deny_list`

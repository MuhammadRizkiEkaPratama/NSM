# Indonesian -> English glossary for identifier renaming.
#
# SINGLE SOURCE OF TRUTH for all renames in this repo. The renaming tool reads
# this file, not just people, so there are not two places that can disagree.
#
# ============================================================================
# THREE BINDING RULES
# ============================================================================
#
# 1. ONE INDONESIAN WORD -> EXACTLY ONE ENGLISH WORD.
#
#    This prevents the most likely damage: `hasil` becoming `result` in one
#    module and `output` in another, so two functions that are really a pair stop
#    looking like a pair. Drifting translations make code harder to read than
#    before translation, because readers must guess whether two different names
#    really mean something different.
#
# 2. WORDS NOT LISTED HERE ARE NOT REPLACED.
#
#    The tool refuses to guess. Identifiers containing an unknown word are left
#    as is and reported, so the word enters this file as a decision rather than
#    being translated silently with a guess nobody reads.
#
# 3. NAMES ALREADY IN ENGLISH ARE NOT TOUCHED.
#
#    `get`, `device`, `db`, `path`, `query`, `commit` and dozens more are already
#    English. Listing them here only adds places to be wrong.
#
# ============================================================================
# WHAT IS NOT TRANSLATED, AND WHY
# ============================================================================
#
# USER-FACING TEXT stays Indonesian. The daily users of NSM are operators at BSP,
# and changing "Perangkat tidak menjawab" into "Device is not responding" would
# not translate the product but move it away from its users.
#
# That covers error messages, page labels, rejection sentences and audit lines.
# What gets translated is the CODE: module names, function names, variable names,
# comments and docstrings.
#
# Making user text switchable between languages is separate work (i18n) that needs
# decisions not yet made: separate message files, how to choose the language, and
# who maintains the translations.
#
# ============================================================================
# WORD LEVEL, NOT IDENTIFIER LEVEL
# ============================================================================
#
# The glossary works per WORD: `kirim_perintah` = kirim + perintah, so two entries
# below cover thousands of names.

# ---------------------------------------------------------------------------
# WHOLE IDENTIFIERS -- when word-by-word gives awkward English
# ---------------------------------------------------------------------------
#
# Indonesian puts the head noun FIRST, English puts it LAST:
#
#     peta ping    -> "map of ping"        -> ping_map,   not map_ping
#     daftar putih -> "list that is white" -> allow_list, not list_allow
#
# Word-by-word translation therefore gives a reversed order for some names. This
# section overrides it for WHOLE identifiers, and is checked BEFORE the
# word-by-word translation.
#
# Only for the awkward ones, not all of them: a complete list of whole identifiers
# would grow to thousands of lines and stop being read, which is the very problem
# this word-level glossary avoids.
pengenal:
  # Phrases that must not be translated word by word. `buka blokir` is ONE English
  # verb (`unblock`), not two; word-by-word gives `unblock_block`. All three
  # members of the family are listed together so none is left in Indonesian alone.
  unblock: unblock
  unblock_acl: unblock_acl
  unblock_any: unblock_any
  # `jeda` here means a monitoring pause (gap), not a scheduler delay.
  find_gaps: find_gaps
  try_login: try_login
  peta_ping: ping_map
  peta_port: port_map
  peta_hostname: hostname_map
  peta_alamat: address_map
  peta_device: device_map
  daftar_putih: allow_list
  daftar_hitam: deny_list
  daftar_jeda: pause_list
  jumlah_baris: line_count
  batas_laju: rate_limit
  jaring_pengaman: safety_net
  akar_masalah: root_cause
  radius_dampak: impact_radius
  waktu_mulai: start_time
  waktu_selesai: end_time
  nama_host: hostname
  nama_berkas: filename
  jalur_berkas: file_path
  pesan_galat: error_message
  kode_status: status_code
  interface_sekarang: current_interface
  baris_sekarang: current_line
  potret_sekarang: current_snapshot

